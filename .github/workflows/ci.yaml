name: CI

on:
  push:
  pull_request:

env:
  URL: http://127.0.0.1:8080
  PROJECT_NAME: barq-assessment

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Python syntax check
        run: python -m py_compile app/server.py validate.py failure_test.py

      - name: App-only unit tests (fake dependencies, no Docker)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Shell script syntax check
        run: |
          bash -n backup.sh
          bash -n restore.sh

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build images
        run: docker compose -p ${{ env.PROJECT_NAME }} build

      - name: Scan Docker images with Trivy
        run: |
          set -euo pipefail

          docker compose -p "${PROJECT_NAME}" config --images | sort -u | while read -r image; do
            echo "Scanning image: ${image}"

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 \
              image \
              --exit-code 0 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity HIGH,CRITICAL \
              "${image}"
          done

      - name: Start stack
        run: docker compose -p ${{ env.PROJECT_NAME }} up -d

      - name: Wait for readiness (bounded)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 ${{ env.URL }}/ready; then
              echo "Ready after ${i} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "Environment never became ready." >&2
          docker compose -p ${{ env.PROJECT_NAME }} ps -a
          docker compose -p ${{ env.PROJECT_NAME }} logs --no-color
          exit 1

      - name: Run validate.py
        run: python validate.py --url ${{ env.URL }}

      - name: Run failure_test.py
        run: python failure_test.py --url ${{ env.URL }} --target app-02
      
      - name: Run backup.sh
        run: bash backup.sh ./backups

      - name: Run restore.sh
        run: bash restore.sh ./backups/*.sql

      - name: Collect logs on failure
        if: failure()
        run: docker compose -p ${{ env.PROJECT_NAME }} logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p ${{ env.PROJECT_NAME }} down --volumes
